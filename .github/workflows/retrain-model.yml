name: Retrain Model on CSV Update

on:
  push:
    paths:
      - 'WA_Fn-UseC_-Telco-Customer-Churn.csv'
  workflow_dispatch:  # Permits manual triggering of the workflow

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Retrain model
      run: |
        python PreProcessing.py
        
    - name: Commit and push updated model
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add logreg_model.joblib model.pkl
        git diff --staged --quiet || git commit -m "🤖 Auto-update model [skip ci]"
        git push